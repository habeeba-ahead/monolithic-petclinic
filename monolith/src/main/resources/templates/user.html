<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'user')}">

  <body>

    <h2>User Profile</h2>
    <div class="row">
        <div class="col-md-12">
          <p><strong>Name:</strong> <span th:text="${name}">User Name</span></p>
          <p><strong>Email:</strong> <span th:text="${email}">user@example.com</span></p>
        </div>
    </div>

  </body>

</html>
