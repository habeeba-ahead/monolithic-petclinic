<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'login')}">

<body>
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3 class="panel-title">Sign in to PetClinic</h3>
                </div>
                <div class="panel-body">
                    <div th:if="${param.logout}" class="alert alert-success">
                        You have been logged out successfully.
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger">
                        Authentication failed. Please try again.
                    </div>
                    
                    <div class="text-center">
                        <h4>Sign in with Google</h4>
                        <a th:href="@{/oauth2/authorization/google}" class="btn btn-primary btn-lg">
                            <span class="glyphicon glyphicon-log-in" aria-hidden="true"></span>
                            Sign in with Google
                        </a>
                    </div>
                    
                    <div class="text-center" style="margin-top: 20px;">
                        <p class="text-muted">
                            Use your Google account to access the Pet Clinic application.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
