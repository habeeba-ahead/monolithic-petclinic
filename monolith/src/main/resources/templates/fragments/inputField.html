<html>
<body>
  <form>
    <th:block th:fragment="input (label, name, type)">
      <div th:with="valid=${!#fields.hasErrors(name)}"
        th:class="${'mb-3 row' + (valid ? '' : ' has-validation')}"
        class="mb-3 row">
        <label class="col-sm-2 col-form-label" th:text="${label}">Label</label>
        <div class="col-sm-10">
            <div th:switch="${type}">
                <input th:case="'text'" th:class="${'form-control' + (valid ? '' : ' is-invalid')}" class="form-control" type="text" th:field="*{__${name}__}" />
                <input th:case="'date'" th:class="${'form-control' + (valid ? '' : ' is-invalid')}" class="form-control" type="text" th:field="*{__${name}__}"
                        placeholder="YYYY-MM-DD" title="Enter a date in this format: YYYY-MM-DD"
                        pattern="(?:19|20)[0-9]{2}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1[0-9]|2[0-9])|(?:(?!02)(?:0[1-9]|1[0-2])-(?:30))|(?:(?:0[13578]|1[02])-31))"/>
            </div>
          <th:block th:if="${!valid}">
            <div class="invalid-feedback" th:errors="*{__${name}__}">Error</div>
          </th:block>
        </div>
      </div>
    </th:block>
  </form>
</body>
</html>
