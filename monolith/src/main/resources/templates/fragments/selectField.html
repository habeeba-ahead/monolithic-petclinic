<html>
<body>
  <form>
    <th:block th:fragment="select (label, name, items)">
      <div th:with="valid=${!#fields.hasErrors(name)}"
        th:class="${'mb-3 row' + (valid ? '' : ' has-validation')}"
        class="mb-3 row">
        <label class="col-sm-2 col-form-label" th:text="${label}">Label</label>

        <div class="col-sm-10">
          <select th:class="${'form-select' + (valid ? '' : ' is-invalid')}" class="form-select" th:field="*{__${name}__}">
            <option th:each="item : ${items}" th:value="${item}"
              th:text="${item}">dog</option>
          </select>
          <th:block th:if="${!valid}">
            <div class="invalid-feedback" th:errors="*{__${name}__}">Error</div>
          </th:block>
        </div>
      </div>
    </th:block>
  </form>
</body>
</html>
