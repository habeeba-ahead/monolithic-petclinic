<!doctype html>
<html th:fragment="layout (template, menu)">

  <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}" />

    <title>PetClinic :: a Spring Framework demonstration</title>

    <!-- Bootstrap 5 CSS served from WebJar -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <!-- PetClinic custom styles -->
    <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}"/>

  </head>

<body>

  <nav class="navbar navbar-expand-lg" role="navigation">
      <div class="container">
          <a class="navbar-brand" th:href="@{/}"><span></span></a>
          <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#main-navbar">
              <span class="navbar-toggler-icon"></span>
          </button>
          <div class="navbar-collapse collapse" id="main-navbar">
              <ul class="nav navbar-nav ms-auto">

                  <li th:fragment="menuItem (path,active,title,glyph,text)" class="nav-item active" th:class="${'nav-item' + (active==menu ? ' active' : '')}">
                      <a class="nav-link" th:href="@{__${path}__}" th:title="${title}">
                        <span th:text="${text}">Template</span>
                      </a>
                  </li>

                  <li th:replace="::menuItem ('/','home','home page','home','Home')">
                      <span>Home</span>
                  </li>

                  <li th:replace="::menuItem ('/owners','owners','owners','th-list','Owners')">
                      <span>Owners</span>
                  </li>

                  <li th:replace="::menuItem ('/vets','vets','veterinarians','th-list','Veterinarians')">
                      <span>Veterinarians</span>
                  </li>

                  <li th:replace="::menuItem ('/management/revenue','management','management','th-list','Management')">
                      <span>Management</span>
                  </li>
              </ul>
          </div>
      </div>
  </nav>
  <div class="container-fluid">
      <div class="container xd-container">

          <th:block th:include="${template}"/>

        <br/>
        <br/>
        <div class="container">
          <div class="row">
            <div class="col-12 text-center">
              <img src="../static/resources/images/spring-pivotal-logo.png" th:src="@{/resources/images/spring-pivotal-logo.png}"
                alt="Sponsored by Pivotal"/></div>
          </div>
        </div>
      </div>
  </div>

  <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
  <script th:src="@{/webjars/jquery-ui/jquery-ui.min.js}"></script>
  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
