# Database
spring.datasource.schema=classpath*:db/schema.sql
spring.datasource.data=classpath*:db/data.sql
# NOTE: No explicit spring.datasource.url / username / password set here;
#       Spring Boot auto-configures an in-memory HSQLDB instance at runtime.
#       When migrating to Cloud SQL, inject credentials via Secret Manager:
# TODO: spring.datasource.url=${DB_URL}          # inject via Secret Manager
# TODO: spring.datasource.username=${DB_USER}    # inject via Secret Manager
# TODO: spring.datasource.password=${DB_PASSWORD} # inject via Secret Manager

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none

# ActiveMQ
# TODO: spring.activemq.broker-url should be injected via Secret Manager / env var, not hardcoded
spring.activemq.broker-url=tcp://localhost:61616

# Internationalization
spring.messages.basename=messages/messages

# Actuator / Management
management.endpoints.web.base-path=/manage
# TODO: exposure.include=* exposes ALL actuator endpoints - restrict before production
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Server endpoint
server.port= 8080
