# Test configuration for E2E tests
logging.level.org.springframework.samples.petclinic.e2e=DEBUG
logging.level.io.fabric8.kubernetes=INFO

# Test timeouts
test.timeout.deployment=300
test.timeout.scaling=180
test.timeout.health=60

# Performance test configuration
test.performance.concurrent.threads=10
test.performance.concurrent.requests=20
test.performance.response.time.max=5000
test.performance.success.rate.min=95.0

# Load test configuration
test.load.duration=120
test.load.threads=20
test.load.requests.per.thread=100