# ActiveMQ
# TODO: activemq.broker-url should be injected via Secret Manager / env var, not hardcoded
activemq.broker-url=tcp://0.0.0.0:61616
spring.jms.template.default-destination=visitCreated

# Actuator / Management
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=hawtio,jolokia
# TODO: hawtio.authenticationEnabled=false disables all Hawtio UI authentication - MUST be enabled or removed before production; inject credentials via Secret Manager
hawtio.authenticationEnabled=false

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Server endpoint
server.port= 8081
