apiVersion: v1
kind: Secret
metadata:
  name: {{ include "petclinic.fullname" . }}-secret
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
type: Opaque
data:
  database-password: {{ index .Values.secrets "database-password" | default "" | b64enc | quote }}
  activemq-password: {{ index .Values.secrets "activemq-password" | default "" | b64enc | quote }}