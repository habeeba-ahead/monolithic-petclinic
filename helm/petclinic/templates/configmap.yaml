apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "petclinic.fullname" . }}-config
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  environment: {{ .Values.environment | quote }}