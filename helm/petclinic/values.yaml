# Default values for petclinic
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: petclinic
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: petclinic.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application specific configuration
app:
  name: petclinic
  port: 8080
  
# Database configuration
database:
  type: h2
  url: "jdbc:h2:mem:testdb"
  username: "sa"
  password: ""

# ActiveMQ configuration
activemq:
  brokerUrl: "tcp://localhost:61616"
  enabled: false

# Environment specific settings
environment: development

# ConfigMap data
config:
  "server.port": "8080"
  "spring.datasource.url": "jdbc:h2:mem:testdb"
  "spring.datasource.username": "sa"
  "spring.activemq.broker-url": "tcp://localhost:61616"
  "management.endpoints.web.base-path": "/manage"
  "management.endpoints.web.exposure.include": "*"
  "logging.level.org.springframework": "INFO"

# Secret data (base64 encoded values will be handled in template)
secrets:
  "database-password": ""
  "activemq-password": ""